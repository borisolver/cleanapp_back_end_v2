name: ChatGPT CleanApp API connectivity test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-connectivity-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test CleanApp endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out -w '%{http_code}' https://live.cleanapp.io/api/v1/human-reports/receipts/nonexistent || true)
          echo "HTTP $code"
          head -c 500 /tmp/out || true
