name: CleanApp API inspect
on:
  push:
    branches: [chatgpt-cleanapp-report-20260909]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and inspect OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://live.cleanapp.io/v1/openapi.yaml -o /tmp/openapi.yaml
          python3 - <<'PY'
          import json, subprocess, sys
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pyyaml'])
          import yaml
          with open('/tmp/openapi.yaml') as f:
              spec=yaml.safe_load(f)
          for p in ['/v1/fetchers/register','/v1/reports:bulkIngest']:
              print('\n===', p, '===')
              print(yaml.safe_dump(spec.get('paths',{}).get(p,{}), sort_keys=False))
          comps=spec.get('components',{}).get('schemas',{})
          wanted=[]
          for name,schema in comps.items():
              text=json.dumps(schema)
              if any(x in text for x in ['source_id','fetcher','media','description','title']) or any(k in name.lower() for k in ['fetch','ingest','report','media']):
                  wanted.append(name)
          print('\n=== schemas ===')
          for name in wanted:
              print('\n--',name,'--')
              print(yaml.safe_dump(comps[name], sort_keys=False))
          PY